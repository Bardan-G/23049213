services:
  mysql_db:
    image: mysql:8.0
    container_name: smart_furniture_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_furn_db
      MYSQL_USER: smart_furn
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: